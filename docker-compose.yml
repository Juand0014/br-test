version: "3.9"  

services:
  backend:
    container_name: quarkus-app
    build:
      context: .
      dockerfile: src/main/docker/Dockerfile.jvm 
    restart: unless-stopped
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://db:5432/clientesdb  
      QUARKUS_DATASOURCE_USERNAME: postgres
      QUARKUS_DATASOURCE_PASSWORD: admin
      QUARKUS_HTTP_HOST: 0.0.0.0  
    ports:
      - "8080:8080"  
    depends_on:
      db:
        condition: service_healthy  
    networks:
      - client-network  

  db:
    container_name: postgres-db
    image: postgres:15.2-alpine 
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: clientesdb
    ports:
      - "5432:5432" 
    volumes:
      - db-data:/var/lib/postgresql/data  
    networks:
      - client-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clientesdb"]  
      interval: 10s  
      retries: 5 
      timeout: 5s

networks:
  client-network:
    driver: bridge 

volumes:
  db-data:  