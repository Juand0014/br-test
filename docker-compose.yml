version: "3.9"  # Versión de Docker Compose

services:
  backend:
    container_name: quarkus-app
    image: quarkus/client-test-jvm:latest  # Imagen de la aplicación Quarkus
    restart: unless-stopped
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://db:5432/clientesdb  # Se conecta a `db`
      QUARKUS_DATASOURCE_USERNAME: postgres
      QUARKUS_DATASOURCE_PASSWORD: admin
      QUARKUS_HTTP_HOST: 0.0.0.0  # Expone la app en todas las interfaces
    ports:
      - "8080:8080"  # Mapea el puerto 8080 del contenedor al host
    depends_on:
      db:
        condition: service_healthy  # 🔹 Espera a que la BD esté lista antes de iniciar
    networks:
      - client-network  # 🔹 Se conecta a la red

  db:
    container_name: postgres-db
    image: postgres:15.2-alpine  # Imagen liviana de PostgreSQL
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: clientesdb
    ports:
      - "5432:5432"  # Mapea el puerto de PostgreSQL
    volumes:
      - db-data:/var/lib/postgresql/data  # 🔹 Persistencia de datos
    networks:
      - client-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clientesdb"]  # Verifica que PostgreSQL esté listo
      interval: 10s  # Intervalo de chequeo
      retries: 5  # Intentos antes de marcar como fallido
      timeout: 5s

networks:
  client-network:
    driver: bridge  # 🔹 Define la red para comunicar los servicios

volumes:
  db-data:  # 🔹 Volumen para persistencia de la BD