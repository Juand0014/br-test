name: CI Build and Run

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v3

      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: 🔧 Set Execution Permission for mvnw
        run: chmod +x mvnw

      - name: 🏗️ Build the Application
        run: ./mvnw clean package -B -DskipTests

      - name: 🐳 Build Docker Image
        run: docker build -t client-test:latest .

      - name: 🚀 Run the Container
        run: docker run -d -p 8080:8080 --name client-app client-test:latest

      - name: ⏳ Wait for App to Start
        run: sleep 15  # Espera 15 segundos para que la app arranque

      - name: 📝 Show Application Logs
        run: docker logs client-app

      - name: 🌐 Test API Endpoint
        run: curl -v http://localhost:8080/q/health
